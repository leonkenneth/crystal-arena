name: Client Build and Lint

on:
  pull_request:
    branches: ["**"]
    paths:
      - 'client/**'
      - '.github/workflows/client-build-lint.yml'

jobs:
  lint-and-build:
    name: Lint and Build Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
